spring.application.name=cspizza

# Base de datos MySQL del proyecto cspizza
spring.datasource.url=${CSPIZZA_DB_URL:jdbc:mysql://localhost:3306/cspizza?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${CSPIZZA_DB_USERNAME:root}
spring.datasource.password=${CSPIZZA_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate; schema.sql/cspizza.sql are applied manually before startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Las respuestas JSON se envian en UTF-8: sin forzar el charset, Tomcat escribe
# los acentos en ISO-8859-1 y los clientes los muestran corruptos.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Avoid running DDL and seed scripts against an existing database on every start.
spring.sql.init.mode=never

# Logging
logging.level.org.hibernate.SQL=warn

# Porcentaje de impuesto (IVA) para facturas generadas desde pedidos (ej. 19 = 19%)
factura.iva.porcentaje=19
