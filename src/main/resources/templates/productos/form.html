<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Producto | cspizza</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="dashboard">
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark">CP</span>
                <span class="brand-name">cspizza</span>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item" th:href="@{/dashboard}"><span class="nav-icon">&#127968;</span>Inicio</a>
                <sec:authorize access="hasAnyRole('EMPLEADO','GERENTE','ADMIN')">
                    <div class="nav-group">
                        <span class="nav-group-label">Ventas</span>
                        <a class="nav-item" th:href="@{/pedidos/nuevo}"><span class="nav-icon">&#127867;</span>Nuevo pedido</a>
                        <a class="nav-item" th:href="@{/pedidos}"><span class="nav-icon">&#128202;</span>Pedidos</a>
                        
                        <sec:authorize access="hasAnyRole('ADMIN','EMPLEADO')">
                            <a class="nav-item" th:href="@{/clientes}"><span class="nav-icon">&#128100;</span>Clientes</a>
                        </sec:authorize>
                    </div>
                </sec:authorize>
                <sec:authorize access="hasAnyRole('GERENTE','ADMIN')">
                    <div class="nav-group">
                        <span class="nav-group-label">Operaciones</span>
                        <a class="nav-item" th:href="@{/productos}"><span class="nav-icon">&#127850;</span>Productos</a>
                        <a class="nav-item" th:href="@{/facturas}"><span class="nav-icon">&#128196;</span>Facturas</a>
                        <a class="nav-item" th:href="@{/inventarios}"><span class="nav-icon">&#128201;</span>Inventario</a>
                    </div>
                </sec:authorize>
                <sec:authorize access="hasRole('ADMIN')">
                    <div class="nav-group">
                        <span class="nav-group-label">Administración</span>
                        <a class="nav-item" th:href="@{/categorias}"><span class="nav-icon">&#128195;</span>Categorías</a>
                        <a class="nav-item" th:href="@{/usuarios}"><span class="nav-icon">&#128103;</span>Usuarios</a>
                    </div>
                </sec:authorize>
            </nav>
            <div class="sidebar-footer">
                <form class="logout-form" th:action="@{/logout}" method="post" style="margin:0;">
                    <button class="btn btn-danger btn-block" type="submit"><span class="nav-icon">&#128274;</span>Cerrar sesión</button>
                </form>
            </div>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <h2>Producto</h2>
                <div class="user-actions">
                    <a class="btn btn-outline btn-sm" th:href="@{/productos}">Volver a productos</a>
                </div>
            </header>
            <section class="flash-messages">
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            </section>
            <div class="page-content">
                <section class="card" style="margin-top:24px; max-width:720px;">
                    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
                        <input type="hidden" th:field="*{idProducto}" />
                        <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}"
                             th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
                        <div class="form-group">
                            <label for="idCategoria">Categoría</label>
                            <select id="idCategoria" class="form-control" th:field="*{idCategoria}">
                                <option value="">-- Seleccione una categoría --</option>
                                <option th:each="categoria : ${categorias}" th:value="${categoria.idCategoria}" th:text="${categoria.nombre}"></option>
                            </select>
                            <div class="alert alert-error" th:if="${#fields.hasErrors('idCategoria')}" th:errors="*{idCategoria}"></div>
                        </div>
                        <div class="form-group">
                            <label for="nombre">Nombre</label>
                            <input id="nombre" class="form-control" type="text" th:field="*{nombre}" required />
                            <div class="alert alert-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>
                        <div class="form-group">
                            <label for="descripcion">Descripción</label>
                            <textarea id="descripcion" class="form-control" th:field="*{descripcion}" rows="4"></textarea>
                            <div class="alert alert-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                        </div>
                        <div class="form-group">
                            <label for="precioUnitario">Precio unitario</label>
                            <input id="precioUnitario" class="form-control" type="number" step="0.01" th:field="*{precioUnitario}" />
                            <div class="alert alert-error" th:if="${#fields.hasErrors('precioUnitario')}" th:errors="*{precioUnitario}"></div>
                        </div>
                        <div class="form-group">
                            <label for="stock">Stock</label>
                            <input id="stock" class="form-control" type="number" th:field="*{stock}" />
                            <div class="alert alert-error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                        </div>
                        <div class="form-group">
                            <label for="estado">Estado</label>
                            <select id="estado" class="form-control" th:field="*{estado}">
                                <option value="ACTIVO">Activo</option>
                                <option value="INACTIVO">Inactivo</option>
                            </select>
                            <div class="alert alert-error" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
                        </div>
                        <div class="form-group">
                            <label for="imagenUrl">URL de imagen</label>
                            <input id="imagenUrl" class="form-control" type="text" th:field="*{imagenUrl}" placeholder="ej. images/pizza-margarita.jpg" />
                            <div class="input-hint">Deja en blanco para usar el placeholder por defecto.</div>
                            <div class="alert alert-error" th:if="${#fields.hasErrors('imagenUrl')}" th:errors="*{imagenUrl}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </form>
                </section>
            </div>
        </main>
    </div>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
