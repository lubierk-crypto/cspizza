<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factura | cspizza</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="dashboard">
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark">CP</span>
                <span class="brand-name">cspizza</span>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item" th:href="@{/dashboard}"><span class="nav-icon">&#127968;</span>Inicio</a>
                <sec:authorize access="hasAnyRole('EMPLEADO','GERENTE','ADMIN')">
                    <div class="nav-group">
                        <span class="nav-group-label">Ventas</span>
                        <a class="nav-item" th:href="@{/pedidos/nuevo}"><span class="nav-icon">&#127867;</span>Nuevo pedido</a>
                        <a class="nav-item" th:href="@{/pedidos}"><span class="nav-icon">&#128202;</span>Pedidos</a>
                        
                        <sec:authorize access="hasAnyRole('ADMIN','EMPLEADO')">
                            <a class="nav-item" th:href="@{/clientes}"><span class="nav-icon">&#128100;</span>Clientes</a>
                        </sec:authorize>
                    </div>
                </sec:authorize>
                <sec:authorize access="hasAnyRole('GERENTE','ADMIN')">
                    <div class="nav-group">
                        <span class="nav-group-label">Operaciones</span>
                        <a class="nav-item" th:href="@{/productos}"><span class="nav-icon">&#127850;</span>Productos</a>
                        <a class="nav-item" th:href="@{/facturas}"><span class="nav-icon">&#128196;</span>Facturas</a>
                        <a class="nav-item" th:href="@{/inventarios}"><span class="nav-icon">&#128201;</span>Inventario</a>
                    </div>
                </sec:authorize>
                <sec:authorize access="hasRole('ADMIN')">
                    <div class="nav-group">
                        <span class="nav-group-label">Administración</span>
                        <a class="nav-item" th:href="@{/categorias}"><span class="nav-icon">&#128195;</span>Categorías</a>
                        <a class="nav-item" th:href="@{/usuarios}"><span class="nav-icon">&#128103;</span>Usuarios</a>
                    </div>
                </sec:authorize>
            </nav>
            <div class="sidebar-footer">
                <form class="logout-form" th:action="@{/logout}" method="post" style="margin:0;">
                    <button class="btn btn-danger btn-block" type="submit"><span class="nav-icon">&#128274;</span>Cerrar sesión</button>
                </form>
            </div>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <h2>Factura</h2>
                <div class="user-actions">
                    <a class="btn btn-outline btn-sm" th:href="@{/facturas}">Volver a facturas</a>
                </div>
            </header>
            <section class="flash-messages">
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            </section>
            <div class="page-content">
                <section class="card" style="margin-top:24px; max-width:720px;">
                    <form th:action="@{/facturas/guardar}" th:object="${factura}" method="post">
                        <input type="hidden" th:field="*{idFactura}" />
                        <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}"
                             th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
                        <div class="form-group">
                            <label for="idPedido">Pedido</label>
                            <select id="idPedido" class="form-control" th:field="*{idPedido}">
                                <option value="">-- Seleccione un pedido --</option>
                                <option th:each="pedido : ${pedidos}" th:value="${pedido.idPedido}" th:text="'Pedido #' + ${pedido.idPedido}"></option>
                            </select>
                            <div class="alert alert-error" th:if="${#fields.hasErrors('idPedido')}" th:errors="*{idPedido}"></div>
                        </div>
                        <div class="form-group">
                            <label for="numeroFactura">Número</label>
                            <input id="numeroFactura" class="form-control" type="text" th:field="*{numeroFactura}" />
                            <div class="alert alert-error" th:if="${#fields.hasErrors('numeroFactura')}" th:errors="*{numeroFactura}"></div>
                        </div>
                        <div class="form-group">
                            <label for="subtotal">Subtotal</label>
                            <input id="subtotal" class="form-control" type="number" step="0.01" th:field="*{subtotal}" />
                            <div class="alert alert-error" th:if="${#fields.hasErrors('subtotal')}" th:errors="*{subtotal}"></div>
                        </div>
                        <div class="form-group">
                            <label for="iva">IVA</label>
                            <input id="iva" class="form-control" type="number" step="0.01" th:field="*{iva}" />
                            <div class="alert alert-error" th:if="${#fields.hasErrors('iva')}" th:errors="*{iva}"></div>
                        </div>
                        <div class="form-group">
                            <label for="total">Total</label>
                            <input id="total" class="form-control" type="number" step="0.01" th:field="*{total}" />
                            <div class="alert alert-error" th:if="${#fields.hasErrors('total')}" th:errors="*{total}"></div>
                        </div>
                        <div class="form-group">
                            <label for="estado">Estado</label>
                            <select id="estado" class="form-control" th:field="*{estado}">
                                <option value="EMITIDA">Emitida</option>
                                <option value="PAGADA">Pagada</option>
                                <option value="ANULADA">Anulada</option>
                            </select>
                            <div class="alert alert-error" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </form>
                </section>
            </div>
        </main>
    </div>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
