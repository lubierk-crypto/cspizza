<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuario | cspizza</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="dashboard">
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark">CP</span>
                <span class="brand-name">cspizza</span>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item" th:href="@{/dashboard}"><span class="nav-icon">&#127968;</span>Inicio</a>
                <sec:authorize access="hasAnyRole('EMPLEADO','GERENTE','ADMIN')">
                    <div class="nav-group">
                        <span class="nav-group-label">Ventas</span>
                        <a class="nav-item" th:href="@{/pedidos/nuevo}"><span class="nav-icon">&#127867;</span>Nuevo pedido</a>
                        <a class="nav-item" th:href="@{/pedidos}"><span class="nav-icon">&#128202;</span>Pedidos</a>
                        
                        <sec:authorize access="hasAnyRole('ADMIN','EMPLEADO')">
                            <a class="nav-item" th:href="@{/clientes}"><span class="nav-icon">&#128100;</span>Clientes</a>
                        </sec:authorize>
                    </div>
                </sec:authorize>
                <sec:authorize access="hasAnyRole('GERENTE','ADMIN')">
                    <div class="nav-group">
                        <span class="nav-group-label">Operaciones</span>
                        <a class="nav-item" th:href="@{/productos}"><span class="nav-icon">&#127850;</span>Productos</a>
                        <a class="nav-item" th:href="@{/facturas}"><span class="nav-icon">&#128196;</span>Facturas</a>
                        <a class="nav-item" th:href="@{/inventarios}"><span class="nav-icon">&#128201;</span>Inventario</a>
                    </div>
                </sec:authorize>
                <sec:authorize access="hasRole('ADMIN')">
                    <div class="nav-group">
                        <span class="nav-group-label">Administración</span>
                        <a class="nav-item" th:href="@{/categorias}"><span class="nav-icon">&#128195;</span>Categorías</a>
                        <a class="nav-item" th:href="@{/usuarios}"><span class="nav-icon">&#128103;</span>Usuarios</a>
                    </div>
                </sec:authorize>
            </nav>
            <div class="sidebar-footer">
                <form class="logout-form" th:action="@{/logout}" method="post" style="margin:0;">
                    <button class="btn btn-danger btn-block" type="submit"><span class="nav-icon">&#128274;</span>Cerrar sesión</button>
                </form>
            </div>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <h2>Usuario</h2>
                <div class="user-actions">
                    <a class="btn btn-outline btn-sm" th:href="@{/usuarios}">Volver a usuarios</a>
                </div>
            </header>
            <section class="flash-messages">
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            </section>
            <div class="page-content">
                <section class="card" style="margin-top:24px; max-width:720px;">
                    <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                        <input type="hidden" th:field="*{idUsuario}" />
                        <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}"
                             th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
                        <div class="form-group">
                            <label for="nombreUsuario">Usuario</label>
                            <input id="nombreUsuario" class="form-control" type="text" th:field="*{nombreUsuario}" maxlength="100" required />
                            <div class="alert alert-error" th:if="${#fields.hasErrors('nombreUsuario')}" th:errors="*{nombreUsuario}"></div>
                        </div>
                        <div class="form-group">
                            <label for="nombre">Nombre</label>
                            <input id="nombre" class="form-control" type="text" th:field="*{nombre}" maxlength="100" required />
                            <div class="alert alert-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>
                        <div class="form-group">
                            <label for="apellido">Apellido</label>
                            <input id="apellido" class="form-control" type="text" th:field="*{apellido}" maxlength="100" required />
                            <div class="alert alert-error" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
                        </div>
                        <div class="form-group">
                            <label for="rol">Rol</label>
                            <select id="rol" class="form-control" th:field="*{rol}" required>
                                <option value="">Selecciona un rol</option>
                                <option value="ADMIN">Administrador</option>
                                <option value="GERENTE">Gerente</option>
                                <option value="EMPLEADO">Empleado</option>
                            </select>
                            <div class="alert alert-error" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></div>
                        </div>
                        <div class="form-group">
                            <label for="correo">Correo</label>
                            <input id="correo" class="form-control" type="email" th:field="*{correo}" maxlength="150" required />
                            <div class="alert alert-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                        </div>
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input id="password" class="form-control" type="password" th:field="*{password}" th:required="${usuario.idUsuario == null}" maxlength="255" />
                            <small th:if="${usuario.idUsuario != null}">Déjala vacía para conservar la contraseña actual.</small>
                            <div class="alert alert-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div class="form-group">
                            <label for="estado">Estado</label>
                            <select id="estado" class="form-control" th:field="*{estado}">
                                <option value="ACTIVO">Activo</option>
                                <option value="INACTIVO">Inactivo</option>
                            </select>
                            <div class="alert alert-error" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </form>
                </section>
            </div>
        </main>
    </div>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
