<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle de pedido | cspizza</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="dashboard">
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark">CP</span>
                <span class="brand-name">cspizza</span>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item" th:href="@{/dashboard}"><span class="nav-icon">&#127968;</span>Inicio</a>
                <sec:authorize access="hasAnyRole('EMPLEADO','GERENTE','ADMIN')">
                    <div class="nav-group">
                        <span class="nav-group-label">Ventas</span>
                        <a class="nav-item" th:href="@{/pedidos/nuevo}"><span class="nav-icon">&#127867;</span>Nuevo pedido</a>
                        <a class="nav-item" th:href="@{/pedidos}"><span class="nav-icon">&#128202;</span>Pedidos</a>
                        
                        <sec:authorize access="hasAnyRole('ADMIN','EMPLEADO')">
                            <a class="nav-item" th:href="@{/clientes}"><span class="nav-icon">&#128100;</span>Clientes</a>
                        </sec:authorize>
                    </div>
                </sec:authorize>
                <sec:authorize access="hasAnyRole('GERENTE','ADMIN')">
                    <div class="nav-group">
                        <span class="nav-group-label">Operaciones</span>
                        <a class="nav-item" th:href="@{/productos}"><span class="nav-icon">&#127850;</span>Productos</a>
                        <a class="nav-item" th:href="@{/facturas}"><span class="nav-icon">&#128196;</span>Facturas</a>
                        <a class="nav-item" th:href="@{/inventarios}"><span class="nav-icon">&#128201;</span>Inventario</a>
                    </div>
                </sec:authorize>
                <sec:authorize access="hasRole('ADMIN')">
                    <div class="nav-group">
                        <span class="nav-group-label">Administración</span>
                        <a class="nav-item" th:href="@{/categorias}"><span class="nav-icon">&#128195;</span>Categorías</a>
                        <a class="nav-item" th:href="@{/usuarios}"><span class="nav-icon">&#128103;</span>Usuarios</a>
                    </div>
                </sec:authorize>
            </nav>
            <div class="sidebar-footer">
                <form class="logout-form" th:action="@{/logout}" method="post" style="margin:0;">
                    <button class="btn btn-danger btn-block" type="submit"><span class="nav-icon">&#128274;</span>Cerrar sesión</button>
                </form>
            </div>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <h2>Detalle de pedido</h2>
                <div class="user-actions">
                    <a class="btn btn-outline btn-sm" th:href="@{/detalle-pedidos}">Volver a detalles</a>
                </div>
            </header>
            <section class="flash-messages">
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            </section>
            <div class="page-content">
                <section class="card" style="margin-top:24px; max-width:720px;">
                    <form th:action="@{/detalle-pedidos/guardar}" th:object="${detallePedido}" method="post">
                        <input type="hidden" th:field="*{idDetallePedido}" />
                        <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}"
                             th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
                        <div class="form-group">
                            <label for="idPedido">Pedido</label>
                            <select id="idPedido" class="form-control" th:field="*{idPedido}">
                                <option value="">-- Seleccione un pedido --</option>
                                <option th:each="pedido : ${pedidos}" th:value="${pedido.idPedido}" th:text="'Pedido #' + ${pedido.idPedido} + ' - ' + ${pedido.estado}"></option>
                            </select>
                            <div class="alert alert-error" th:if="${#fields.hasErrors('idPedido')}" th:errors="*{idPedido}"></div>
                        </div>
                        <div class="form-group">
                            <label for="idProducto">Producto</label>
                            <select id="idProducto" class="form-control" th:field="*{idProducto}">
                                <option value="">-- Seleccione un producto --</option>
                                <option th:each="producto : ${productos}" th:value="${producto.idProducto}" th:text="${producto.nombre} + ' ($' + ${producto.precioUnitario} + ')'"></option>
                            </select>
                            <div class="alert alert-error" th:if="${#fields.hasErrors('idProducto')}" th:errors="*{idProducto}"></div>
                        </div>
                        <div class="form-group">
                            <label for="cantidad">Cantidad</label>
                            <input id="cantidad" class="form-control" type="number" th:field="*{cantidad}" />
                            <div class="alert alert-error" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></div>
                        </div>
                        <div class="form-group">
                            <label for="observacion">Observación</label>
                            <textarea id="observacion" class="form-control" th:field="*{observacion}" rows="3"></textarea>
                            <div class="alert alert-error" th:if="${#fields.hasErrors('observacion')}" th:errors="*{observacion}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </form>
                </section>
            </div>
        </main>
    </div>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
