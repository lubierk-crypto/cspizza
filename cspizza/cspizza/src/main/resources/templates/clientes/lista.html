<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes | cspizza</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="dashboard">
    <div class="container">
        <header class="topbar">
            <h2>Clientes</h2>
            <div class="user-actions">
                <a class="logout-link" th:href="@{/dashboard}">Inicio</a>
                <a class="logout-link" th:href="@{/logout}">Cerrar sesión</a>
            </div>
        </header>

        <section class="hero">
            <h3>Gestión de clientes</h3>
            <p>Consulta y administra la información de los clientes del negocio.</p>
            <a class="btn btn-primary" th:href="@{/clientes/nuevo}" style="width:auto; display:inline-flex;">Nuevo cliente</a>
        </section>

        <section class="card" style="margin-top:24px;">
            <table style="width:100%; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th style="text-align:left; padding:12px; border-bottom:1px solid #ddd;">Nombre</th>
                        <th style="text-align:left; padding:12px; border-bottom:1px solid #ddd;">Apellido</th>
                        <th style="text-align:left; padding:12px; border-bottom:1px solid #ddd;">Correo</th>
                        <th style="text-align:left; padding:12px; border-bottom:1px solid #ddd;">Teléfono</th>
                        <th style="text-align:left; padding:12px; border-bottom:1px solid #ddd;">Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}">
                        <td style="padding:12px; border-bottom:1px solid #eee;" th:text="${cliente.nombre}">Nombre</td>
                        <td style="padding:12px; border-bottom:1px solid #eee;" th:text="${cliente.apellido}">Apellido</td>
                        <td style="padding:12px; border-bottom:1px solid #eee;" th:text="${cliente.correo}">Correo</td>
                        <td style="padding:12px; border-bottom:1px solid #eee;" th:text="${cliente.telefono}">Teléfono</td>
                        <td style="padding:12px; border-bottom:1px solid #eee;" th:text="${cliente.estado}">Estado</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>
</body>
</html>
