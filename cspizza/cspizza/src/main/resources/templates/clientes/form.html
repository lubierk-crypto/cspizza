<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cliente | cspizza</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="dashboard">
    <div class="container">
        <header class="topbar">
            <h2>Cliente</h2>
            <div class="user-actions">
                <a class="logout-link" th:href="@{/clientes}">Cancelar</a>
            </div>
        </header>

        <section class="card" style="margin-top:24px; max-width:720px;">
            <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
                <input type="hidden" th:field="*{idCliente}" />

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" class="form-control" type="text" th:field="*{nombre}" required />
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input id="apellido" class="form-control" type="text" th:field="*{apellido}" required />
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input id="telefono" class="form-control" type="text" th:field="*{telefono}" />
                </div>

                <div class="form-group">
                    <label for="correo">Correo</label>
                    <input id="correo" class="form-control" type="email" th:field="*{correo}" />
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección</label>
                    <input id="direccion" class="form-control" type="text" th:field="*{direccion}" />
                </div>

                <div class="form-group">
                    <label for="estado">Estado</label>
                    <input id="estado" class="form-control" type="text" th:field="*{estado}" />
                </div>

                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </section>
    </div>
</body>
</html>
