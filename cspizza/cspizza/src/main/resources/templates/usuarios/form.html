<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuario | cspizza</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="dashboard">
    <div class="container">
        <header class="topbar">
            <h2>Usuario</h2>
            <div class="user-actions">
                <a class="logout-link" th:href="@{/usuarios}">Cancelar</a>
            </div>
        </header>

        <section class="card" style="margin-top:24px; max-width:720px;">
            <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{idUsuario}" />

                <div class="form-group">
                    <label for="nombreUsuario">Usuario</label>
                    <input id="nombreUsuario" class="form-control" type="text" th:field="*{nombreUsuario}" required />
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" class="form-control" type="text" th:field="*{nombre}" />
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input id="apellido" class="form-control" type="text" th:field="*{apellido}" />
                </div>

                <div class="form-group">
                    <label for="rol">Rol</label>
                    <input id="rol" class="form-control" type="text" th:field="*{rol}" />
                </div>

                <div class="form-group">
                    <label for="correo">Correo</label>
                    <input id="correo" class="form-control" type="email" th:field="*{correo}" />
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input id="password" class="form-control" type="password" th:field="*{password}" />
                </div>

                <div class="form-group">
                    <label for="estado">Estado</label>
                    <input id="estado" class="form-control" type="text" th:field="*{estado}" />
                </div>

                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </section>
    </div>
</body>
</html>
