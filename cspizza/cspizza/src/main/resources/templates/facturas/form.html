<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factura | cspizza</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="dashboard">
    <div class="container">
        <header class="topbar">
            <h2>Factura</h2>
            <div class="user-actions">
                <a class="logout-link" th:href="@{/facturas}">Cancelar</a>
            </div>
        </header>

        <section class="card" style="margin-top:24px; max-width:720px;">
            <form th:action="@{/facturas/guardar}" th:object="${factura}" method="post">
                <input type="hidden" th:field="*{idFactura}" />

                <div class="form-group">
                    <label for="idPedido">Pedido</label>
                    <input id="idPedido" class="form-control" type="number" th:field="*{idPedido}" />
                </div>

                <div class="form-group">
                    <label for="numeroFactura">Número</label>
                    <input id="numeroFactura" class="form-control" type="text" th:field="*{numeroFactura}" />
                </div>

                <div class="form-group">
                    <label for="subtotal">Subtotal</label>
                    <input id="subtotal" class="form-control" type="number" step="0.01" th:field="*{subtotal}" />
                </div>

                <div class="form-group">
                    <label for="iva">IVA</label>
                    <input id="iva" class="form-control" type="number" step="0.01" th:field="*{iva}" />
                </div>

                <div class="form-group">
                    <label for="total">Total</label>
                    <input id="total" class="form-control" type="number" step="0.01" th:field="*{total}" />
                </div>

                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </section>
    </div>
</body>
</html>
