<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productos | cspizza</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="dashboard">
    <div class="container">
        <header class="topbar">
            <h2>Productos</h2>
            <div class="user-actions">
                <a class="logout-link" th:href="@{/dashboard}">Inicio</a>
                <a class="logout-link" th:href="@{/logout}">Cerrar sesión</a>
            </div>
        </header>

        <section class="hero">
            <h3>Catálogo de productos</h3>
            <p>Administra precios, stock y estado de los productos.</p>
            <a class="btn btn-primary" th:href="@{/productos/nuevo}" style="width:auto; display:inline-flex;">Nuevo producto</a>
        </section>

        <section class="card" style="margin-top:24px;">
            <table style="width:100%; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th style="text-align:left; padding:12px; border-bottom:1px solid #ddd;">Nombre</th>
                        <th style="text-align:left; padding:12px; border-bottom:1px solid #ddd;">Precio</th>
                        <th style="text-align:left; padding:12px; border-bottom:1px solid #ddd;">Stock</th>
                        <th style="text-align:left; padding:12px; border-bottom:1px solid #ddd;">Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="producto : ${productos}">
                        <td style="padding:12px; border-bottom:1px solid #eee;" th:text="${producto.nombre}">Nombre</td>
                        <td style="padding:12px; border-bottom:1px solid #eee;" th:text="${producto.precioUnitario}">Precio</td>
                        <td style="padding:12px; border-bottom:1px solid #eee;" th:text="${producto.stock}">Stock</td>
                        <td style="padding:12px; border-bottom:1px solid #eee;" th:text="${producto.estado}">Estado</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>
</body>
</html>
