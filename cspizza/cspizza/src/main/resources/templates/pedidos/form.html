<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedido | cspizza</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body class="dashboard">
    <div class="container">
        <header class="topbar">
            <h2>Pedido</h2>
            <div class="user-actions">
                <a class="logout-link" th:href="@{/pedidos}">Cancelar</a>
            </div>
        </header>

        <section class="card" style="margin-top:24px; max-width:720px;">
            <form th:action="@{/pedidos/guardar}" th:object="${pedido}" method="post">
                <input type="hidden" th:field="*{idPedido}" />

                <div class="form-group">
                    <label for="idCliente">Cliente</label>
                    <input id="idCliente" class="form-control" type="number" th:field="*{idCliente}" />
                </div>

                <div class="form-group">
                    <label for="idUsuario">Usuario</label>
                    <input id="idUsuario" class="form-control" type="number" th:field="*{idUsuario}" />
                </div>

                <div class="form-group">
                    <label for="estado">Estado</label>
                    <input id="estado" class="form-control" type="text" th:field="*{estado}" />
                </div>

                <div class="form-group">
                    <label for="totalPedido">Total</label>
                    <input id="totalPedido" class="form-control" type="number" step="0.01" th:field="*{totalPedido}" />
                </div>

                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </section>
    </div>
</body>
</html>
